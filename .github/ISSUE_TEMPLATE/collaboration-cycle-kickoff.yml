assignees: []
body:
  - type: markdown
    attributes:
      value: "# Get started with the Collaboration Cycle"
  - type: markdown
    attributes:
      value: |
        This ticket initiates the [Collaboration Cycle](https://depo-platform-documentation.scrollhelp.site/collaboration-cycle/) for your team's product or feature. The Collaboration Cycle helps teams who are building products on VA.gov and/or the VA Mobile App get feedback and guidance on their product/feature throughout their project's lifecycle to ensure their work meets VA.gov experience standards. Learn more about the [Collaboration Cycle kickoff](https://depo-platform-documentation.scrollhelp.site/collaboration-cycle/collaboration-cycle-kickoff).
  - type: markdown
    attributes:
      value: "## Team and product information"
  - type: dropdown
    id: product-team
    attributes:
      label: Your team name
      description: "Select your team from the list (sorted alphabetically). Not seeing your team here? [Add your team to the manifest](https://github.com/department-of-veterans-affairs/va.gov-team-sensitive/blob/master/teams/teams-manifest-user-guide.md)"
      options:
      - Accelerate Cybersecurity Excellence (ACE) (24001)
      - Accessibility Digital Experience (ADE) (23001)
      - Accredited Reps. - Accreditation (10001)
      - Accredited Reps. - Appoint (10002)
      - Accredited Reps. - Benefits (10003)
      - Analytics and Insights (23002)
      - Ask VA (22008)
      - Authenticated Experience (22001)
      - BIO Aquia (19002)
      - BIO HEART (19003)
      - BIO Huntridge (19004)
      - BIO Pingwind (19001)
      - Benefits Management Tools 1 (11001)
      - Benefits Management Tools 2 (11002)
      - Benefits Management Tools 3 (11003)
      - Clinical Design System - Data Visualization Design Patterns (30001)
      - Conditions (12001)
      - Content Management System (24002)
      - Content and Information Architecture (21001)
      - Core Veteran Experience 1 (22004)
      - Core Veteran Experience 2 (22009)
      - Decision Reviews (11004)
      - Dependents Management Tools (13001)
      - Design & Forms Systems (23003)
      - Disability Benefits Crew - Core 526 (12002)
      - Disability Benefits Crew Team 5 (12004)
      - Disability Pathways (12003)
      - Employee Experience (11005)
      - Faceted Search (21004)
      - Facilities (29001)
      - Financial Management (22003)
      - GovCIO VEBT (40002)
      - Governance (23004)
      - Health Apps (33001)
      - Horizon (31001)
      - Hydra (32001)
      - Identity (20001)
      - Medical Records (31002)
      - Medications, Medical Devices and Supplies (31003)
      - Memorials Self-Service (41001)
      - Messaging (31004)
      - Mobile App and Platform (22005)
      - Mobile Feature Support (22006)
      - My Education Benefits (40003)
      - Notify Experience (22010)
      - Notify Platform (22002)
      - Orion (32002)
      - Pension & Burial Benefits (13002)
      - Platform Infrastructure Services (24003)
      - Platform Security (24004)
      - Platform Site Reliability Engineering (24005)
      - Platform Support (23005)
      - Public Websites (29003)
      - Reapers (29002)
      - Ursa Minor (32003)
      - VA Chatbot (21002)
      - VES Transition Experience (21003)
      - VEText (39001)
      - VFMP Status Integration (33003)
      - Veteran Support (22007)
      - Watch Engineers (24006)
    validations:
      required: true
  - type: input
    id: product-name
    attributes:
      label: Product name
      description: See [terms and definitions on products vs. features](https://depo-platform-documentation.scrollhelp.site/getting-started/product-operations-terms-and-definition).
    validations:
      required: true
  - type: input
    id: feature-name
    attributes:
      label: Feature name
      description: See [terms and definitions on products vs. features](https://depo-platform-documentation.scrollhelp.site/getting-started/product-operations-terms-and-definition).
    validations:
      required: true
  - type: textarea
    id: initiative-overview
    attributes:
      label: Initiative overview
      description: Briefly describe what you are building.
    validations:
      required: true
  - type: input
    id: product-directory-link
    attributes:
      label: Product directory link
      description: Please enter a URL for your product in the Product Directory. If your product isn't in the directory, or needs to be updated, [Request an update to the Product directory](https://github.com/department-of-veterans-affairs/product-directory/issues/new?template=update-product-request.yml).
    validations:
      required: true
  - type: input
    id: product-label
    attributes:
      label: GitHub label for product
      description: Enter a label from the va.gov-team repo. Your product label must be different than your team label.
    validations:
      required: true
  - type: input
    id: feature-label
    attributes:
      label: GitHub label for feature
      description: Enter a label from the va.gov-team repo, if applicable.
    validations:
      required: false
  - type: markdown
    attributes:
      value: "## Kickoff questions"
  - type: markdown
    attributes:
      value: |
        Please refer to the guidance on the [Collaboration Cycle Kickoff](https://depo-platform-documentation.scrollhelp.site/collaboration-cycle/collaboration-cycle-kickoff) page on Platform Website for detailed information and examples regarding these questions.
  - type: dropdown
    id: intended-audience
    attributes:
      label: Who is the primary audience for this product?
      options:
        - "Individuals (Veterans, their caregivers, families, survivors, or representatives directly supporting a Veteran)"
        - "Organizations (e.g., VA employees, contractors, representatives working in an organizational capacity, etc.)"
    validations:
      required: true
  - type: dropdown
    id: visible-changes
    attributes:
      label: Will your work result in visible changes to the user experience?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: dropdown
    id: mobile-web
    attributes:
      label: Where will your product live?
      description: If you are building a product for VA.gov and the VA Mobile App then you must bring the product through the Collaboration Cycle twice, once for each domain.
      options:
        - "VA.gov"
        - "VA Mobile App"
    validations:
      required: true