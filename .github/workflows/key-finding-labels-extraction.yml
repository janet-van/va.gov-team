name: Key Finding Labels Extraction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-key-finding-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RECALIBRATION_TREND_STRICT: 'true'

    steps:
      - name: Sparse checkout for extraction
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/scripts/
            .github/workflows/
            products/
            teams/
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run key finding labels extraction
        id: extract
        run: >
          node .github/scripts/key-finding-labels-extraction/run.js
          --mode=workflow
          --scan=full
          --taxonomy-mode=off
          --emit-legacy-taxonomy=true

      - name: Validate output contract (blocking)
        run: >
          node .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/scripts/check-contract.js
          --strict=true

      - name: Capture first snapshot
        run: >
          node .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/scripts/capture-snapshot.js
          --out-file=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-snapshot-run1.json

      - name: Validate baseline metric thresholds (blocking)
        run: >
          node .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/scripts/check-metric-thresholds.js
          --baseline=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/latest-snapshot.json
          --current=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-snapshot-run1.json
          --thresholds=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/metric-thresholds.json
          --out-file=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-threshold-check.json
          --strict=true

      - name: Re-run extraction for determinism check
        run: >
          node .github/scripts/key-finding-labels-extraction/run.js
          --mode=workflow
          --scan=full
          --taxonomy-mode=off
          --emit-legacy-taxonomy=true

      - name: Capture second snapshot
        run: >
          node .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/scripts/capture-snapshot.js
          --out-file=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-snapshot-run2.json

      - name: Compare snapshots for determinism (blocking)
        run: >
          node .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/scripts/compare-snapshots.js
          --baseline=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-snapshot-run1.json
          --current=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-snapshot-run2.json
          --out-file=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-determinism-parity.json
          --strict=true

      - name: Generate feedback scorecard
        run: >
          node .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/scripts/generate-feedback-scorecard.js
          --out-file=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/latest-feedback-scorecard.json

      - name: Generate drift report
        run: >
          node .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/scripts/generate-drift-report.js
          --out-file=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/latest-drift-report.md

      - name: Generate recalibration dataset
        run: >
          node .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/scripts/generate-recalibration-dataset.js
          --out-file=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-recalibration-dataset.jsonl
          --manifest-file=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-recalibration-dataset-manifest.json

      - name: Check recalibration trends (configurable strict mode)
        run: >
          node .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/scripts/check-recalibration-trends.js
          --baseline=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/latest-recalibration-dataset-manifest.json
          --current=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-recalibration-dataset-manifest.json
          --thresholds=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/recalibration-thresholds.json
          --out-file=.github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-recalibration-trend-check.json
          --strict=${{ env.RECALIBRATION_TREND_STRICT }}

      - name: Upload extraction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-finding-labels-extraction-${{ github.run_id }}
          path: |
            key-finding-labels-extraction-summary.json
            key-finding-labels-extraction-findings.json
            key-finding-labels-extraction-validation.json
            key-finding-labels-extraction-patterns.json
            key-finding-labels-extraction-enrichment.json
            key-finding-labels-extraction-portfolio.json
            key-finding-labels-extraction-adjudication.json
            key-finding-labels-extraction-feedback-ingestion.json
            key-finding-labels-extraction-correction-application.json
            key-finding-labels-extraction-report.md
            reports/research-taxonomy/taxonomy-data.json
            reports/research-taxonomy/taxonomy-report.md
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/latest-check.json
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-snapshot-run1.json
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-snapshot-run2.json
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-determinism-parity.json
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-threshold-check.json
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/latest-feedback-scorecard.json
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/latest-drift-report.md
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/latest-recalibration-dataset-manifest.json
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-recalibration-dataset.jsonl
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-recalibration-dataset-manifest.json
            .github/scripts/key-finding-labels-extraction/docs/taxonomy-merge-plan/baseline/workflow-recalibration-trend-check.json
          if-no-files-found: error
          retention-days: 30

      - name: Append concise run summary
        if: always()
        run: |
          if [ -f key-finding-labels-extraction-step-summary.md ]; then
            cat key-finding-labels-extraction-step-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No step summary file generated" >> "$GITHUB_STEP_SUMMARY"
          fi
