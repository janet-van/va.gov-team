name: Governance Collaboration Cycle intake

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue-number:
        description: "Issue number to run this workflow for. This is for testing manual runs only."
        required: false
        type: number

permissions:
  id-token: write
  contents: read

jobs:
  process-intake:
    name: Process collaboration cycle intake
    runs-on: ubuntu-latest
    # TODO: Update to final labels when ready to go live.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'collaboration-cycle-testing')
    outputs:
      tests-failed: ${{ steps.unit-tests.outcome == 'failure' }}
      script-failed: ${{ steps.run-script.outcome == 'failure' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github
            team-lookup.json
            scripts/github-actions/gov-team/cc-intake

      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-gov-west-1
          role-to-assume: ${{ vars.GOVERNANCE_AWS_ASSUME_ROLE }}
          output-credentials: true

      - name: Get GitHub bot token
        uses: department-of-veterans-affairs/action-inject-ssm-secrets@latest
        with:
          ssm_parameter: /devops/VA_VFS_BOT_GITHUB_TOKEN
          env_variable_name: VA_VFS_BOT_GITHUB_TOKEN

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: "./scripts/github-actions/gov-team/cc-intake/.nvmrc"
          cache: "yarn"
          cache-dependency-path: "./scripts/github-actions/gov-team/cc-intake/yarn.lock"

      - name: Install Node modules
        run: yarn install --frozen-lockfile
        working-directory: ./scripts/github-actions/gov-team/cc-intake

      - name: Run script
        id: run-script
        continue-on-error: true
        run: node cc-intake.js
        working-directory: ./scripts/github-actions/gov-team/cc-intake
        env:
          GITHUB_TOKEN: ${{ env.VA_VFS_BOT_GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue-number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Run unit tests
        id: unit-tests
        if: steps.run-script.outcome == 'success'
        continue-on-error: true
        run: yarn test
        working-directory: ./scripts/github-actions/gov-team/cc-intake

      - name: Fail job if script failed
        if: steps.run-script.outcome == 'failure'
        run: exit 1

  slack-notify-script-failure:
    name: Notify Slack of script failure
    runs-on: ubuntu-latest
    needs: process-intake
    if: always() && needs.process-intake.outputs.script-failed == 'true'

    steps:
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-gov-west-1
          role-to-assume: ${{ vars.GOVERNANCE_AWS_ASSUME_ROLE }}
          output-credentials: true

      - name: Get Slack bot token
        uses: department-of-veterans-affairs/action-inject-ssm-secrets@latest
        with:
          ssm_parameter: /devops/github_actions_slack_bot_user_token
          env_variable_name: SLACK_BOT_TOKEN

      - name: Notify Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C088E31CS6M",
              "text": "Collaboration Cycle intake script failed",
              "attachments": [{
                "color": "#b21d38",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "The Collaboration Cycle intake script failed while processing issue <${{ github.server_url }}/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.inputs.issue-number }}|#${{ github.event.issue.number || github.event.inputs.issue-number }}>.\n\nThis script is responsible for:\n• Creating and assigning a milestone to the issue\n• Building the issue body with touchpoint links and formatted content\n• Updating the issue with the formatted body\n• Adding team and product labels to the issue\n\nBecause the script failed, the issue may be missing its milestone, formatted body, or labels. Unit tests were also skipped.\n\nPlease verify the issue, more details on what failed can be found in run <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}> under the Run Script step. You may need to manually edit the issue with the correct data. If you believe the failure is due to a problem with the script, rather than the team's input or data, notify a developer to investigate."
                  }
                }]
              }]
            }

  slack-notify-unit-test-failure:
    name: Notify Slack of unit test failure
    runs-on: ubuntu-latest
    needs: process-intake
    if: needs.process-intake.result == 'success' && needs.process-intake.outputs.tests-failed == 'true'

    steps:
      - name: Configure AWS Credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-gov-west-1
          role-to-assume: ${{ vars.GOVERNANCE_AWS_ASSUME_ROLE }}
          output-credentials: true

      - name: Get Slack bot token
        uses: department-of-veterans-affairs/action-inject-ssm-secrets@latest
        with:
          ssm_parameter: /devops/github_actions_slack_bot_user_token
          env_variable_name: SLACK_BOT_TOKEN

      - name: Notify Slack
        uses: slackapi/slack-github-action@v3.0.1
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel": "C088E31CS6M",
              "text": "Collaboration Cycle intake unit tests failed",
              "attachments": [{
                "color": "#b21d38",
                "blocks": [{
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Automated tests for the Collaboration Cycle intake script failed on issue <${{ github.server_url }}/${{ github.repository }}/issues/${{ github.event.issue.number || github.event.inputs.issue-number }}|#${{ github.event.issue.number || github.event.inputs.issue-number }}>.\n\nThis script is responsible for:\n• Creating and assigning a milestone to the issue\n• Building the issue body with touchpoint links and formatted content\n• Updating the issue with the formatted body\n• Adding team and product labels to the issue\n\nThe script ran successfully, but the tests that verify its output failed. Please check that the issue has the correct milestone, formatted body, and labels. Notify a developer to look at the failed unit tests in run <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|#${{ github.run_id }}>."
                  }
                }]
              }]
            }